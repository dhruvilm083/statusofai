<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>status of ai</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Script&family=Fraunces:ital,opsz,wght,SOFT@1,9..144,500,100;1,9..144,700,100&display=swap" rel="stylesheet">
<style>
  :root { --sky: #8fd3f4; --brown: #5c3317; --yellow: #ffd23f; --yellow-pale: #fff3c4; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-variation-settings: "SOFT" 100;
    color: var(--brown);
    background-color: var(--sky);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 0;
    text-align: center;
    overflow-x: hidden;
  }

  /* drifting cloud grid */
  #sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .cloud {
    position: absolute;
    top: 0;
    left: 0;
    fill: none;
    stroke-width: 5;
    stroke-linejoin: round;
    stroke: rgba(92, 51, 23, 0.4);
    transition: stroke 2s ease-in-out;
    will-change: transform;
  }
  .cloud.yellow { stroke: var(--yellow); }

  main, footer { position: relative; z-index: 1; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; width: 100%; }
  h1 {
    margin: 0 0 32px;
    font-family: "League Script", cursive;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(3.2rem, 13vw, 8rem);
    line-height: 1.1;
    padding: 0 0.15em;
    color: var(--brown);
    -webkit-text-stroke: 3px var(--brown);
    text-shadow: 3px 3px 0 var(--yellow);
  }
  form {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: clamp(1.3rem, 4.5vw, 2rem);
    font-weight: 500;
    max-width: 900px;
  }
  label { padding-right: 0.1em; }
  .box {
    position: relative;
    display: flex;
    align-items: center;
    width: min(480px, 80vw);
    background: var(--yellow-pale);
    border: 4px solid var(--brown);
    border-radius: 18px;
    padding: 6px 18px;
    box-shadow: 5px 5px 0 var(--yellow);
    overflow: hidden;
  }
  .box:focus-within { background: #fffbe3; }
  input {
    width: 100%;
    font: inherit;
    font-variation-settings: inherit;
    color: var(--brown);
    background: transparent;
    border: none;
    padding: 2px 1.2em 2px 0;
    outline: none;
  }
  input::placeholder { color: rgba(92, 51, 23, 0.45); }
  /* invisible copy of the text, used to place the "?" right after it */
  #measure { position: absolute; visibility: hidden; white-space: pre; font: inherit; font-variation-settings: inherit; }
  #qmark { position: absolute; top: 50%; transform: translateY(-50%); pointer-events: none; }
  #qmark.empty { color: rgba(92, 51, 23, 0.45); }
  button {
    font: inherit;
    font-variation-settings: inherit;
    font-weight: 700;
    color: var(--yellow);
    background: var(--brown);
    border: none;
    border-radius: 18px;
    padding: 8px 22px;
    cursor: pointer;
    box-shadow: 5px 5px 0 var(--yellow);
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  #result {
    margin-top: 36px;
    font-size: clamp(1.3rem, 4.5vw, 2rem);
    font-weight: 500;
    min-height: 3em;
    max-width: 800px;
    overflow-wrap: anywhere;
  }
  #result .big { font-weight: 700; font-size: 1.5em; display: block; margin-bottom: 8px; text-shadow: 2px 2px 0 var(--yellow); }
  #result .year { display: block; margin-top: 14px; }
  footer {
    width: calc(100% + 32px);
    margin: 40px -16px 0;
    padding: 16px;
    border-top: 1px solid rgba(92, 51, 23, 0.2);
    background: var(--sky);
    font-family: system-ui, sans-serif;
    font-style: normal;
    font-size: 12px;
    color: rgba(92, 51, 23, 0.7);
  }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<main>
  <h1>status of ai</h1>
  <form id="ask">
    <label for="task">can ai</label>
    <div class="box">
      <input id="task" name="task" autocomplete="off" maxlength="300" required>
      <span id="measure"></span>
      <span id="qmark">?</span>
    </div>
    <button type="submit">ask</button>
  </form>
  <div id="result" aria-live="polite"></div>
</main>
<footer>© 2026 made with 💛 by daedalus</footer>
<script>
  const form = document.getElementById("ask");
  const input = document.getElementById("task");
  const measure = document.getElementById("measure");
  const qmark = document.getElementById("qmark");
  const result = document.getElementById("result");
  const button = form.querySelector("button");

  const examples = [
    "fold my laundry", "do my taxes", "drive me to work", "cook dinner", "write my essay",
    "walk my dog", "fix my car", "cut my hair", "clean my room", "plan my wedding",
    "be my doctor", "make a movie", "build a house", "teach my kid math", "paint my house",
    "mow my lawn", "write a hit song", "do my job", "babysit my kids", "win a nobel prize",
  ];
  input.placeholder = examples[Math.floor(Math.random() * examples.length)];

  // Keep the "?" sitting right after whatever is typed (or the example text).
  function placeQuestionMark() {
    measure.textContent = input.value || input.placeholder;
    qmark.classList.toggle("empty", !input.value);
    const padLeft = parseFloat(getComputedStyle(input.parentElement).paddingLeft);
    const max = padLeft + input.clientWidth - qmark.offsetWidth;
    qmark.style.left = Math.min(padLeft + measure.offsetWidth - input.scrollLeft + 2, max) + "px";
  }
  ["input", "scroll", "keyup", "click"].forEach((ev) => input.addEventListener(ev, placeQuestionMark));
  window.addEventListener("resize", placeQuestionMark);
  document.fonts.ready.then(placeQuestionMark);
  placeQuestionMark();

  // Drifting cloud grid: the same staggered pattern as before, all clouds moving together
  // diagonally at one speed. A few are yellow, and now and then one slowly fades between colors.
  const sky = document.getElementById("sky");
  const CLOUD = "M4 18a7 7 0 0 1 7-7 10 10 0 0 1 18-3 7 7 0 0 1 11 6 5 5 0 0 1 0 10H9a5 5 0 0 1-5-6z";
  const TILE_W = 140, TILE_H = 110, CLOUD_W = 26, SPEED = 14; // px per second
  const SPOTS = [[24, 18], [89, 71]]; // cloud positions inside each tile
  const YELLOW_SHARE = 0.10;
  let clouds = [], gridW = 0, gridH = 0;

  function buildSky() {
    sky.replaceChildren();
    clouds = [];
    const cols = Math.ceil(innerWidth / TILE_W) + 1;
    const rows = Math.ceil(innerHeight / TILE_H) + 1;
    gridW = cols * TILE_W;
    gridH = rows * TILE_H;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        for (const [sx, sy] of SPOTS) {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("viewBox", "0 0 48 28");
          svg.setAttribute("width", CLOUD_W);
          svg.setAttribute("class", "cloud" + (Math.random() < YELLOW_SHARE ? " yellow" : ""));
          svg.innerHTML = `<path d="${CLOUD}" stroke-width="${(3 * 48) / CLOUD_W}"/>`;
          sky.appendChild(svg);
          clouds.push({ el: svg, x: c * TILE_W + sx, y: r * TILE_H + sy });
        }
      }
    }
  }

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const start = performance.now();
  function frame(now) {
    const d = reduceMotion ? 0 : ((now - start) / 1000) * SPEED;
    const dx = d, dy = d * (TILE_H / TILE_W);
    for (const cl of clouds) {
      const x = ((cl.x + dx) % gridW) - TILE_W / 2;
      const y = ((cl.y + dy) % gridH) - TILE_H / 2;
      cl.el.style.transform = `translate(${x}px, ${y}px)`;
    }
    requestAnimationFrame(frame);
  }

  // every second, four random clouds slowly swap color, keeping roughly the same yellow share
  const SWAPS_PER_TICK = 4;
  setInterval(() => {
    for (let n = 0; n < SWAPS_PER_TICK && clouds.length; n++) {
      const yellows = clouds.filter((c) => c.el.classList.contains("yellow"));
      const makeYellow = yellows.length < clouds.length * YELLOW_SHARE;
      const pool = makeYellow ? clouds.filter((c) => !c.el.classList.contains("yellow")) : yellows;
      if (pool.length) pool[Math.floor(Math.random() * pool.length)].el.classList.toggle("yellow");
    }
  }, 1000);

  buildSky();
  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(buildSky, 200); });
  requestAnimationFrame(frame);

  // "be my doctor" -> "be your doctor" for the answer line
  function toYour(text) {
    const swaps = { my: "your", me: "you", mine: "yours", myself: "yourself", i: "you", "i'm": "you're", am: "are" };
    return text.replace(/\b(i'm|myself|mine|my|me|i|am)\b/gi, (w) => swaps[w.toLowerCase()]);
  }

  function show(parts) {
    result.replaceChildren(...parts.map(([cls, text]) => {
      const el = document.createElement("span");
      el.className = cls;
      el.textContent = text;
      return el;
    }));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const task = input.value.trim().replace(/\?+$/, "");
    if (!task) return;
    button.disabled = true;
    show([["", "thinking..."]]);
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong");
      if (data.can) {
        show([["big", "Yes."]]);
      } else {
        show([
          ["big", "No."],
          ["", `ai cannot ${toYour(task)}.`],
          ["year", data.year === "never"
            ? "ai can probably never do this for you."
            : `ai can probably do this around ${data.year}.`],
        ]);
      }
    } catch (err) {
      show([["", err.message]]);
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>status of ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Script&family=Fraunces:ital,opsz,wght,SOFT@1,9..144,500,100;1,9..144,700,100&display=swap" rel="stylesheet">
<style>
  :root { --sky: #8fd3f4; --brown: #5c3317; --yellow: #ffd23f; --yellow-pale: #fff3c4; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-variation-settings: "SOFT" 100;
    color: var(--brown);
    background-color: var(--sky);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 0;
    text-align: center;
    overflow-x: hidden;
  }

  /* drifting clouds */
  #sky { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .cloud {
    position: absolute;
    fill: none;
    stroke-linejoin: round;
    animation: drift linear infinite;
  }
  .cloud.brown { stroke: rgba(92, 51, 23, 0.4); }
  .cloud.yellow { stroke: var(--yellow); }
  @keyframes drift {
    from { transform: translate(0, 0); }
    to { transform: translate(130vh, 130vh); }
  }
  @media (prefers-reduced-motion: reduce) { .cloud { animation-play-state: paused; } }

  main, footer { position: relative; z-index: 1; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; width: 100%; }
  h1 {
    margin: 0 0 32px;
    font-family: "League Script", cursive;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(3.2rem, 13vw, 8rem);
    line-height: 1.1;
    padding: 0 0.15em;
    color: var(--brown);
    -webkit-text-stroke: 3px var(--brown);
    text-shadow: 3px 3px 0 var(--yellow);
  }
  form {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: clamp(1.3rem, 4.5vw, 2rem);
    font-weight: 500;
    max-width: 900px;
  }
  label { padding-right: 0.1em; }
  .box {
    position: relative;
    display: flex;
    align-items: center;
    width: min(480px, 80vw);
    background: var(--yellow-pale);
    border: 4px solid var(--brown);
    border-radius: 18px;
    padding: 6px 18px;
    box-shadow: 5px 5px 0 var(--yellow);
    overflow: hidden;
  }
  .box:focus-within { background: #fffbe3; }
  input {
    width: 100%;
    font: inherit;
    font-variation-settings: inherit;
    color: var(--brown);
    background: transparent;
    border: none;
    padding: 2px 1.2em 2px 0;
    outline: none;
  }
  input::placeholder { color: rgba(92, 51, 23, 0.45); }
  /* invisible copy of the text, used to place the "?" right after it */
  #measure { position: absolute; visibility: hidden; white-space: pre; font: inherit; font-variation-settings: inherit; }
  #qmark { position: absolute; top: 50%; transform: translateY(-50%); pointer-events: none; }
  #qmark.empty { color: rgba(92, 51, 23, 0.45); }
  button {
    font: inherit;
    font-variation-settings: inherit;
    font-weight: 700;
    color: var(--yellow);
    background: var(--brown);
    border: none;
    border-radius: 18px;
    padding: 8px 22px;
    cursor: pointer;
    box-shadow: 5px 5px 0 var(--yellow);
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  #result {
    margin-top: 36px;
    font-size: clamp(1.3rem, 4.5vw, 2rem);
    font-weight: 500;
    min-height: 3em;
    max-width: 800px;
    overflow-wrap: anywhere;
  }
  #result .big { font-weight: 700; font-size: 1.5em; display: block; margin-bottom: 8px; text-shadow: 2px 2px 0 var(--yellow); }
  #result .year { display: block; margin-top: 14px; }
  footer {
    width: calc(100% + 32px);
    margin: 40px -16px 0;
    padding: 16px;
    border-top: 1px solid rgba(92, 51, 23, 0.2);
    background: var(--sky);
    font-family: system-ui, sans-serif;
    font-style: normal;
    font-size: 12px;
    color: rgba(92, 51, 23, 0.7);
  }
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<main>
  <h1>status of ai</h1>
  <form id="ask">
    <label for="task">can ai</label>
    <div class="box">
      <input id="task" name="task" autocomplete="off" maxlength="300" required>
      <span id="measure"></span>
      <span id="qmark">?</span>
    </div>
    <button type="submit">ask</button>
  </form>
  <div id="result" aria-live="polite"></div>
</main>
<footer>© 2026 made with 💛 by daedalus</footer>
<script>
  const form = document.getElementById("ask");
  const input = document.getElementById("task");
  const measure = document.getElementById("measure");
  const qmark = document.getElementById("qmark");
  const result = document.getElementById("result");
  const button = form.querySelector("button");

  const examples = [
    "fold my laundry", "do my taxes", "drive me to work", "cook dinner", "write my essay",
    "walk my dog", "fix my car", "cut my hair", "clean my room", "plan my wedding",
    "be my doctor", "make a movie", "build a house", "teach my kid math", "paint my house",
    "mow my lawn", "write a hit song", "do my job", "babysit my kids", "win a nobel prize",
  ];
  input.placeholder = examples[Math.floor(Math.random() * examples.length)];

  // Keep the "?" sitting right after whatever is typed (or the example text).
  function placeQuestionMark() {
    measure.textContent = input.value || input.placeholder;
    qmark.classList.toggle("empty", !input.value);
    const padLeft = parseFloat(getComputedStyle(input.parentElement).paddingLeft);
    const max = padLeft + input.clientWidth - qmark.offsetWidth;
    qmark.style.left = Math.min(padLeft + measure.offsetWidth - input.scrollLeft + 2, max) + "px";
  }
  ["input", "scroll", "keyup", "click"].forEach((ev) => input.addEventListener(ev, placeQuestionMark));
  window.addEventListener("resize", placeQuestionMark);
  document.fonts.ready.then(placeQuestionMark);
  placeQuestionMark();

  // Drifting clouds: random spots, sizes and speeds; mostly brown, a few yellow.
  // Each one starts above/left of the screen and drifts diagonally down-right.
  const sky = document.getElementById("sky");
  const CLOUD = "M4 18a7 7 0 0 1 7-7 10 10 0 0 1 18-3 7 7 0 0 1 11 6 5 5 0 0 1 0 10H9a5 5 0 0 1-5-6z";
  const count = Math.max(18, Math.round((innerWidth * innerHeight) / 13000));
  for (let i = 0; i < count; i++) {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    const size = 26 + Math.random() * 22;
    svg.setAttribute("viewBox", "0 0 48 28");
    svg.setAttribute("width", size);
    svg.setAttribute("class", "cloud " + (Math.random() < 0.18 ? "yellow" : "brown"));
    svg.innerHTML = `<path d="${CLOUD}" stroke-width="${(3 * 48) / size}"/>`;
    const duration = 45 + Math.random() * 45;
    // start just above the page, anywhere from far left (so it drifts in from the side) to the right edge
    const t = Math.random();
    svg.style.left = `calc(${t * 100}vw - ${(1 - t) * 130}vh)`;
    svg.style.top = "-60px";
    svg.style.animationDuration = duration + "s";
    svg.style.animationDelay = -(Math.random() * duration) + "s";
    sky.appendChild(svg);
  }

  function show(parts) {
    result.replaceChildren(...parts.map(([cls, text]) => {
      const el = document.createElement("span");
      el.className = cls;
      el.textContent = text;
      return el;
    }));
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const task = input.value.trim().replace(/\?+$/, "");
    if (!task) return;
    button.disabled = true;
    show([["", "thinking..."]]);
    try {
      const res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong");
      if (data.can) {
        show([["big", "Yes."]]);
      } else {
        show([
          ["big", "No."],
          ["", `ai cannot ${task}.`],
          ["year", `ai can probably do this around ${data.year}.`],
        ]);
      }
    } catch (err) {
      show([["", err.message]]);
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
